# Home Assistant automations for the Maidenhair Fern (PM4 / "Plant Monitor 4").
#
# Add to your automations.yaml (or paste via the UI as YAML).
#
# IMPORTANT: confirm the actual entity id of PM4's soil moisture sensor.
#   Developer Tools > States, search "plant_monitor_4" or "PM4".
#   It is commonly: sensor.plant_monitor_4_soil_moisture
#   Replace the entity_id below if yours differs.
#
# Thresholds are a starting point for Adiantum (keep evenly moist).
# Calibrate against your own readings — see maidenhair-fern.md.

- id: maidenhair_fern_too_dry
  alias: "Maidenhair Fern - soil too dry (water now)"
  description: >
    Maidenhairs die from drying out even once. Alerts when PM4 soil moisture
    drops below the safe band.
  trigger:
    - platform: numeric_state
      entity_id: sensor.plant_monitor_4_soil_moisture
      below: 40
      for:
        minutes: 30        # avoid false alarms from a single noisy reading
  condition: []
  action:
    - service: notify.notify
      data:
        title: "🌿 Maidenhair Fern needs water"
        message: >
          PM4 soil moisture is {{ states('sensor.plant_monitor_4_soil_moisture') }}%
          (below 40%). Water the maidenhair now — don't let it dry out.
  mode: single

- id: maidenhair_fern_too_wet
  alias: "Maidenhair Fern - soil too wet (root rot risk)"
  description: >
    Alerts if soil stays saturated for a long stretch, risking root rot.
  trigger:
    - platform: numeric_state
      entity_id: sensor.plant_monitor_4_soil_moisture
      above: 85
      for:
        hours: 24
  condition: []
  action:
    - service: notify.notify
      data:
        title: "🌿 Maidenhair Fern is too wet"
        message: >
          PM4 soil moisture has been {{ states('sensor.plant_monitor_4_soil_moisture') }}%
          (above 85%) for over a day. Let it drain — moist, not soggy.
  mode: single

# Optional: a daily nudge if you'd rather check on a schedule than react to alerts.
